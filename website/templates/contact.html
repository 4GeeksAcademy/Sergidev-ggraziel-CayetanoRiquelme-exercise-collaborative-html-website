<section class="container my-5">
    <hr>
    <h2 class="display-5 fw-bold">Contact</h2>
    <p class="text-muted mb-4">
        Donec ullamcorper nulla non metus auctor fringilla. Vestibulum id ligula porta felis euismod semper. 
        Praesent commodo cursus magna, vel scelerisque nisl consectetur. Fusce dapibus, tellus ac cursus commodo.
    </p>

    <div class="bg-light col-sm-9 p-3 rounded-3 border mx-auto">
        <form>
            <div class="row mb-3 align-items-center">
                <label for="email" class="col-sm-3 col-form-label text-sm-end fw-bold">Your E-mail</label>
                <div class="col-sm-9">
                    <input type="email" class="form-control" id="email" placeholder="Your email">
                </div>
            </div>

            <div class="row mb-3">
                <label for="message" class="col-sm-3 col-form-label text-sm-end fw-bold">Your message</label>
                <div class="col-sm-9">
                    <textarea class="form-control" id="message" rows="4" placeholder="Please enter your message here..."></textarea>
                </div>
            </div>

            <div class="row">
                <div class="col-sm-9 offset-sm-3 text-end">
                    <button type="submit" class="btn btn-primary px-4 shadow-sm">Submit</button>
                </div>
            </div>
        </form>
    </div>
</section>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>First Heading</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
    }

    .section {
      padding: 80px 0;
    }

    .custom-img {
      width: 350px;
      height: 350px;
      object-fit: cover;
    }

    h2 {
      font-weight: 700;
    }

    p {
      color: #6c757d;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="container section">
    <div class="row align-items-center">

      <div class="col-md-7">
        <h2>
          This First Heading 
          <span class="text-muted">Will Catch Your Eye</span>
        </h2>

        <p>
          Donec ullamcorper nulla non metus auctor fringilla. Vestibulum id ligula porta felis euismod semper.
          Praesent commodo cursus magna, vel scelerisque nisl consectetur. Fusce dapibus, tellus ac cursus commodo.
        </p>
      </div>

      <div class="col-md-5 text-center">
        <img 
          src="https://i.imgur.com/3GvwNBf.png" 
          alt="avatar"
          class="img-fluid rounded-circle custom-img"
        >
      </div>

    </div>
  </div>

</body>
</html>
